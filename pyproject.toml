[project]
name = "bautomate-proj"
version = "0.1.0"
description = "Bautomate PropTech Analytics - Azure Lakehouse"
authors = [
    {name = "Thufail",email = "thufail@example.com"}
]
requires-python = "^3.12"
dependencies = [
    "pyspark (>=4.2.0,<5.0.0)",
    "delta-spark (>=4.4.0,<5.0.0)",
    "azure-storage-file-datalake (>=12.25.0,<13.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "mlflow (>=3.16.0,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "azure-identity (>=1.25.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "kaggle (>=2.2.4,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]
